name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir project
          unzip -q LoveByAlte.zip -d project
          ROOT=$(dirname "$(find project -name settings.gradle.kts | head -n 1)")
          echo "ROOT=$ROOT" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        working-directory: ${{ env.ROOT }}
        run: gradle assembleDebug assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LoveByAlte-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/**/*.apk
